# Deploy na Netlify (o adaptador de Next.js é detectado automaticamente).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Endereço público (sitemap.xml, robots.txt e metadados de compartilhamento).
  NEXT_PUBLIC_SITE_URL = "https://pdfparajpg.netlify.app"
